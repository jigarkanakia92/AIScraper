[mypy]
python_version = 3.11
ignore_missing_imports = True
# We have many `# type: ignore` on optional-dep imports. They're
# unused when the lib is installed (the test/dev env) but used
# when running type checks in a slim prod-like env. Don't warn.
warn_unused_ignores = False
warn_redundant_casts = True

# Crawl4AI ships without type stubs; treat all third-party web-scraping libs
# the same way so mypy doesn't block CI.
[mypy-crawl4ai.*]
ignore_missing_imports = True
